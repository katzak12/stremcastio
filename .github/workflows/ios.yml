name: iOS IPA (unsigned, for AltStore / SideStore)

on:
  push:
    branches: [main]
    tags: ['v*']
    paths: ['app/**', '.github/workflows/ios.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - run: npm ci
      - run: npm test

      - name: Bake in the default subtitle relay
        if: ${{ vars.RELAY_URL != '' }}
        env:
          RELAY_URL: ${{ vars.RELAY_URL }}
        run: |
          node -e "const fs=require('fs');const c=JSON.parse(fs.readFileSync('app.json','utf8'));c.expo.extra.relayUrl=process.env.RELAY_URL;fs.writeFileSync('app.json',JSON.stringify(c,null,2))"

      - name: Generate native project
        run: npx expo prebuild --platform ios

      - name: Build (no code signing — AltStore/SideStore signs it)
        run: |
          set -o pipefail
          xcodebuild \
            -workspace ios/SubCast.xcworkspace \
            -scheme SubCast \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build | tail -40

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/SubCast.app Payload/
          zip -qr ../SubCast.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: SubCast-ios
          path: SubCast.ipa

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: SubCast.ipa
